<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Simulador Monte Carlo - Chris LC</title>
<style>
  body{font-family:Arial,sans-serif;background:#0f172a;color:#fff;padding:20px;max-width:800px;margin:auto}
  h1{color:#facc15} .card{background:#1e293b;padding:20px;border-radius:12px;margin-top:15px}
  button{background:#facc15;border:none;padding:12px 20px;font-weight:bold;border-radius:8px;cursor:pointer;width:100%;font-size:16px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:15px}
  .stat{background:#0f172a;padding:12px;border-radius:8px}
  .stat b{color:#facc15;font-size:18px}
  label{display:block;margin-top:10px} input,select{width:100%;padding:8px;border-radius:6px;border:none;margin-top:4px}
  canvas{width:100%;background:#fff;border-radius:8px;margin-top:15px}
</style>
</head>
<body>
<h1>Simulador Monte Carlo - Álbum</h1>
<p>Por <b>Chris LC</b> | Licencia MIT | Réplica de Gretl</p>

<div class="card">
  <label>Expansión
    <select id="expansion">
     <option value="68">Isla Singular - Solo Rombos - 68 cartas</option>
     <option value="86">Isla Singular - Completa - 86 cartas</option>
     <option value="75">Luz Triunfal - Solo Rombos - 75 cartas</option>
     <option value="96">Luz Triunfal - Completa - 96 cartas</option>
    </select>
  </label>
  <label>Número de simulaciones <input id="sims" type="number" value="1000"></label>
  <label>Cartas por sobre <input id="porSobre" type="number" value="5"></label>
  <label>Precio por sobre (relojes) <input id="precio" type="number" value="12"></label>
  <button onclick="calcular()">CALCULAR</button>
</div>

<div class="card" id="resultados" style="display:none">
  <h2>=== MONTECARLO - RESULTADOS ===</h2>
  <p id="n_target"></p>
  <p id="precioTxt"></p>
  <p id="bench"></p>
  <p id="benchRep"></p>

  <h3>Sobres REAL</h3>
  <div class="grid">
    <div class="stat">Media sobres<br><b id="media"></b></div>
    <div class="stat">Mediana<br><b id="mediana"></b></div>
    <div class="stat">Desv<br><b id="desv"></b></div>
    <div class="stat">P90<br><b id="p90"></b></div>
    <div class="stat">P95<br><b id="p95"></b></div>
    <div class="stat">Ratio Real / Uniforme<br><b id="ratio"></b></div>
  </div>

  <h3>Cartas Repetidas REAL</h3>
  <div class="grid">
    <div class="stat">Media repetidas<br><b id="mediaRep"></b></div>
    <div class="stat">Mediana repetidas<br><b id="medianaRep"></b></div>
    <div class="stat">Desv repetidas<br><b id="desvRep"></b></div>
    <div class="stat">P90 repetidas<br><b id="p90Rep"></b></div>
    <div class="stat">P95 repetidas<br><b id="p95Rep"></b></div>
  </div>
  <canvas id="grafica" width="700" height="250"></canvas>
</div>

<script>
function quantile(arr,q){
  const s=[...arr].sort((a,b)=>a-b);
  const pos=(s.length-1)*q;
  const base=Math.floor(pos), rest=pos-base;
  return s[base]+(s[base+1]-s[base])*rest;
}
function mean(a){return a.reduce((x,y)=>x+y,0)/a.length}
function sd(a){const m=mean(a);return Math.sqrt(a.reduce((s,x)=>s+(x-m)**2,0)/a.length)}
function drawCarta123_Luz(){
  return Math.floor(Math.random()*31);
}
function drawCarta4_Luz(){
  const r = Math.random()*100;
  if(r < 0.040) return 95;
  if(r < 0.262) return 94;
  if(r < 0.762) return 81 + Math.floor(Math.random()*13);
  if(r < 3.334) return 75 + Math.floor(Math.random()*6);
  if(r < 5.000) return 70 + Math.floor(Math.random()*5);
  if(r < 10.000) return 57 + Math.floor(Math.random()*13);
  return 31 + Math.floor(Math.random()*26);
}
function drawCarta5_Luz(){
  const r = Math.random()*100;
  if(r < 0.160) return 95;
  if(r < 1.048) return 94;
  if(r < 3.048) return 81 + Math.floor(Math.random()*13);
  if(r < 13.336) return 75 + Math.floor(Math.random()*6);
  if(r < 20.000) return 70 + Math.floor(Math.random()*5);
  if(r < 40.000) return 57 + Math.floor(Math.random()*13);
  return 31 + Math.floor(Math.random()*26);
}
function buildWeights(n){
  // Pesos para replicar rareza: comunes pesan más, corona pesa muy poco
  // 68 = Isla solo rombos, 86 = isla completa, 75 = Luz solo rombos, 96 = Luz completa 
  let w=[];
  if(n===68){
    for(let i=0;i<68;i++){
      if(i<40) w.push(1.0);
      else if(i<58) w.push(0.45);
      else w.push(0.18);
    }
  } else {
    for(let i=0;i<86;i++){
      if(i<45) w.push(1.0);
      else if(i<68) w.push(0.35);
      else if(i<84) w.push(0.08);
      else w.push(0.015); // corona
    }
  }
  const tot=w.reduce((a,b)=>a+b,0);
  return w.map(x=>x/tot);
}

function calcular(){
  const n=parseInt(document.getElementById('expansion').value);
  const sims=parseInt(document.getElementById('sims').value);
  const porSobre=parseInt(document.getElementById('porSobre').value);
  const precio=parseInt(document.getElementById('precio').value);
  const probs=buildWeights(n);

  // Muestreo ponderado por ruleta
  const cum=[]; let acc=0;
  for(let p of probs){acc+=p; cum.push(acc);}
  function draw(){
    const r=Math.random();
    let lo=0, hi=cum.length-1;
    while(lo<hi){let mid=(lo+hi)>>1; if(cum[mid]<r) lo=mid+1; else hi=mid;}
    return lo;
  }

  const sobresArr=[], repArr=[];
  for(let s=0;s<sims;s++){
    const seen=new Set(); let sobres=0, totalCartas=0;
    while(seen.size<n){
      sobres++;
     if(n===75){
  let c1=drawCarta123_Luz(); if(c1<75) seen.add(c1); totalCartas++;
  let c2=drawCarta123_Luz(); if(c2<75) seen.add(c2); totalCartas++;
  let c3=drawCarta123_Luz(); if(c3<75) seen.add(c3); totalCartas++;
  let c4=drawCarta4_Luz(); if(c4<75) seen.add(c4); totalCartas++;
  let c5=drawCarta5_Luz(); if(c5<75) seen.add(c5); totalCartas++;
} else if(n===96){
  seen.add(drawCarta123_Luz()); totalCartas++;
  seen.add(drawCarta123_Luz()); totalCartas++;
  seen.add(drawCarta123_Luz()); totalCartas++;
  seen.add(drawCarta4_Luz()); totalCartas++;
  seen.add(drawCarta5_Luz()); totalCartas++;
} else {
  for(let k=0;k<porSobre;k++){ seen.add(draw()); totalCartas++; }
}
    }
    sobresArr.push(sobres);
    repArr.push(totalCartas - n); // repetidas = total - únicas
  }

  // Benchmark uniforme: n * H_n / porSobre
  let Hn=0; for(let i=1;i<=n;i++) Hn+=1/i;
  const benchUniforme = (n*Hn)/porSobre;
  const benchRep = n*Hn - n;

  const med=mean(sobresArr), medRep=mean(repArr);
  document.getElementById('resultados').style.display='block';
  document.getElementById('n_target').textContent=`N_target = ${n} cartas` + (n===86?' (rombos + estrellas + corona)':'');
  document.getElementById('precioTxt').textContent=`Precio = ${precio} relojes por sobre (fijo)`;
  document.getElementById('bench').textContent=`Benchmark uniforme = ${benchUniforme.toFixed(2)} sobres = ${(benchUniforme*precio).toFixed(0)} relojes`;
  document.getElementById('benchRep').textContent=`Benchmark repetidas = ${benchRep.toFixed(2)} cartas`;

  document.getElementById('media').textContent=`${med.toFixed(2)} sobres = ${(med*precio).toFixed(0)} relojes`;
  document.getElementById('mediana').textContent=`${quantile(sobresArr,0.5).toFixed(2)} sobres`;
  document.getElementById('desv').textContent=`${sd(sobresArr).toFixed(2)} sobres`;
  document.getElementById('p90').textContent=`${quantile(sobresArr,0.9).toFixed(2)} sobres`;
  document.getElementById('p95').textContent=`${quantile(sobresArr,0.95).toFixed(2)} sobres`;
  document.getElementById('ratio').textContent=`${(med/benchUniforme).toFixed(2)} x`;

  document.getElementById('mediaRep').textContent=`${medRep.toFixed(2)} cartas`;
  document.getElementById('medianaRep').textContent=`${quantile(repArr,0.5).toFixed(2)} cartas`;
  document.getElementById('desvRep').textContent=`${sd(repArr).toFixed(2)} cartas`;
  document.getElementById('p90Rep').textContent=`${quantile(repArr,0.9).toFixed(2)} cartas`;
  document.getElementById('p95Rep').textContent=`${quantile(repArr,0.95).toFixed(2)} cartas`;

  // Gráfica simple
  const cv=document.getElementById('grafica'), ctx=cv.getContext('2d');
  ctx.clearRect(0,0,cv.width,cv.height);
  const buckets=new Array(20).fill(0);
  const mn=Math.min(...sobresArr), mx=Math.max(...sobresArr);
  sobresArr.forEach(v=>{let b=Math.floor((v-mn)/(mx-mn)*19); buckets[b]++});
  const maxB=Math.max(...buckets);
  buckets.forEach((b,i)=>{ctx.fillStyle='#facc15'; ctx.fillRect(i*35,250-(b/maxB*220),28,(b/maxB*220))});
}
</script>
</body>
</html>
